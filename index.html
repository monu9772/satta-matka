<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalyan Channel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:#fff;
  text-align:center;
}

.container{
  max-width:500px;
  margin:auto;
  padding:40px 20px;
}

.logo{
  width:150px;
  height:150px;
  border-radius:50%;
  margin:20px auto;
  background:#f5b400;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  color:#111;
  box-shadow:0 0 25px #f5b400;
}

h1{
  font-size:32px;
  margin:20px 0 10px;
}

p{
  color:#ccc;
  font-size:17px;
  line-height:1.6;
  margin-bottom:25px;
}

.join-btn{
  display:block;
  width:100%;
  padding:18px;
  background:#229ed9;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
}

.join-btn:hover{
  opacity:.9;
}

.note{
  margin-top:25px;
  font-size:14px;
  color:#888;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    KSM
  </div>

  <h1>Kalyan Channel</h1>

  <p>
    Join our Telegram channel for regular updates
    and information.
  </p>

  <a
    class="join-btn"
    href="https://t.me/+WAZXcUdwNnYxZGE9"
    target="_blank"
  >
    JOIN TELEGRAM
  </a>

  <div class="note">
    Click the button above to join our Telegram channel.
  </div>

</div>

</body>
</html>
